# Builds the dedicated server's Docker image (design.md 3.12) and pushes it
# to GitHub Container Registry whenever a version tag is pushed - same
# trigger as release-client.yml, but a separate workflow since it needs a
# Linux runner (Docker build) rather than Windows (jpackage). Migrated
# verbatim from the StarWars project's identical workflow.
#
# This repo is public, but a GHCR package's own visibility is a separate
# setting from the repo's - the first push here creates the package, and it
# may default to private; check/flip it to public under the package's own
# settings on GitHub if Container Station on the NAS should pull it without
# a Personal Access Token.
name: Release server image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # jgitver (design.md 3.9) computes the version from git tags/
          # history - a shallow, tag-less checkout would break that.
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the server image
        env:
          IMAGE: ghcr.io/mariokoehler/robotrampage-server
        # APP_VERSION (plain "0.0.1", no "v") threads through to the
        # Dockerfile's ARG/jgitver.use-version override (see its comment) -
        # jgitver's own auto-detection reliably miscomputed a -SNAPSHOT
        # version for this exact kind of checkout in the StarWars project
        # this was migrated from, so we tell it the version we already know
        # from $GITHUB_REF_NAME instead.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -f server/Dockerfile --build-arg "APP_VERSION=$VERSION" -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"
