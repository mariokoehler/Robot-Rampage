# Builds the packaged Windows client (design.md 3.11) and publishes it to a
# GitHub Release whenever a version tag is pushed. Runs the exact same
# `release-client` Maven profile a local build would - see lwjgl3/pom.xml.
# Migrated verbatim from the StarWars project's identical workflow.
#
# This repo is public, so the resulting release asset (and update.cmd's own
# anonymous download of it) works for anyone, unlike the StarWars project's
# equivalent workflow, which is still private.
name: Release client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-client:
    # jpackage --type app-image produces a Windows-native app-image (a real
    # .exe + a Windows-built jlink runtime) - this has to run on Windows,
    # not just target it.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # jgitver (design.md 3.9) computes the version from git tags/
          # history - a shallow, tag-less checkout would break that.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the client zip
        # Same command as a local release build (README/CLAUDE.md) - -am so
        # `core` is built fresh in this reactor run, no separate install step
        # needed on a clean CI checkout - PLUS an explicit jgitver.use-version
        # override (design.md 3.9): jgitver's own tag-vs-HEAD auto-detection
        # reliably miscomputed "X.Y.(Z+1)-SNAPSHOT" in GitHub Actions'
        # checkout even exactly on a tag in the StarWars project this was
        # migrated from (confirmed on v0.0.2/v0.0.3 there), despite behaving
        # correctly on an identical local/fresh clone - a known class of
        # jgitver+CI ref-ambiguity issue, root cause not fully pinned down.
        # Since this workflow only ever runs because a specific tag was
        # pushed, we already know the intended version with certainty -
        # telling jgitver directly sidesteps the auto-detection bug entirely
        # rather than chasing it further.
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          mvn -pl lwjgl3 -am -Prelease-client "-Djgitver.use-version=$version" verify

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "lwjgl3/target/RobotRampage-Client.zip" `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
